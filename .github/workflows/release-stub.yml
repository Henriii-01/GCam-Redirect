name: Release stub APK

on:
  release:
    types:
      - created
      - edited
      - published
      - prereleased

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: chmod +x gradlew && ./gradlew assembleStubRelease
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SUFFIX=""
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            SUFFIX="-alpha"
          fi
          "$TOOLS/zipalign" -f 4 \
            app/build/outputs/apk/stub/release/app-stub-release-unsigned.apk "gcam-redirect-stub${SUFFIX}.apk"
          "$TOOLS/apksigner" sign \
            --ks keystore.jks --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            "gcam-redirect-stub${SUFFIX}.apk"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" gcam-redirect-stub*.apk --clobber
